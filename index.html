<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acesso | Paula Cabelos OS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 8%,#984263 0,transparent 34%),linear-gradient(135deg,#381020,#6d203e 70%,#491329);font-family:Arial,sans-serif;color:#281f23;display:grid;place-items:center;padding:22px}.card{width:min(430px,100%);background:#fff;border-radius:25px;padding:38px;box-shadow:0 35px 90px #1d071250}.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}.mark{width:44px;height:44px;border-radius:14px;background:#55172f;color:#fff;display:grid;place-items:center;font:700 17px Georgia}.brand b{font:20px Georgia}.brand small{display:block;margin-top:3px;color:#9e7d8a;text-transform:uppercase;letter-spacing:.12em}h1{font:600 29px Georgia;margin:0 0 9px}p{color:#7d7076;font-size:13px;line-height:1.55;margin:0 0 22px}label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:bold;color:#846875}.row{display:flex;gap:9px}input{font:inherit;min-width:0;flex:1;border:1px solid #d9c8cf;border-radius:11px;padding:13px;outline:none}input:focus{border-color:#812b4c;box-shadow:0 0 0 3px #812b4c18}button{font:inherit;border:0;border-radius:11px;padding:0 18px;background:#812b4c;color:#fff;font-weight:bold;cursor:pointer}.error{min-height:18px;color:#b42c51;margin:9px 0 0}.note{border-top:1px solid #eee3e7;margin-top:19px;padding-top:16px;font-size:11px}@media(max-width:520px){.card{padding:28px 22px}.row{display:grid}.row button{padding:13px}}
  </style>
</head>
<body>
  <section class="card">
    <div class="brand"><div class="mark">PC</div><div><b>Paula Cabelos</b><small>Management OS</small></div></div>
    <h1>Acesso à operação</h1>
    <p>Este ambiente é reservado à gestão da Paula Cabelos. Digite a senha para continuar.</p>
    <form id="access"><label for="password">Senha de acesso</label><div class="row"><input id="password" type="password" autocomplete="current-password" required autofocus placeholder="Digite sua senha"><button>Entrar</button></div><p class="error" id="error" aria-live="polite"></p></form>
    <p class="note">O acesso permanecerá ativo somente nesta aba do navegador.</p>
  </section>
  <script>
    const target='operacao-7c4e91.html',expected='d4cdd11dba70e5c7327b87cbdb19b7f1a02c86b4a0f2877c28cb0760834e2ddf';
    async function digest(value){const bytes=new TextEncoder().encode(value),hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
    if(sessionStorage.getItem('pc-access')==='granted')location.replace(target);
    document.querySelector('#access').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#password'),error=document.querySelector('#error');error.textContent='Verificando…';if(await digest(input.value)===expected){sessionStorage.setItem('pc-access','granted');location.replace(target)}else{error.textContent='Senha incorreta. Tente novamente.';input.select()}});
  </script>
</body>
</html>
